name: Backup pg_dump

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      system:
        description: Which protected system to dump
        required: true
        default: all
        type: choice
        options:
          - all
          - vault
          - cosmo-prod

concurrency:
  group: backup-pg-dump
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BACKUP_DIRECT_URL_VAULT: ${{ secrets.BACKUP_DIRECT_URL_VAULT }}
      BACKUP_DIRECT_URL_COSMO_PROD: ${{ secrets.BACKUP_DIRECT_URL_COSMO_PROD }}
      # R2 rejects the default CRC checksums newer AWS CLI v2 sends on upload
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # awscli is not in Ubuntu 24.04 apt; ubuntu-latest ships AWS CLI v2 already.
      # pg_dump must be >= the Neon server major, so pull 17 from PGDG (stock noble is 16).
      - name: Install pg_dump 17, age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          pg_dump --version
          age --version
          aws --version

      - name: Dump vault
        id: vault
        if: github.event_name == 'schedule' || inputs.system == 'all' || inputs.system == 'vault'
        continue-on-error: true
        run: bash scripts/backup/dump.sh --system vault

      - name: Dump cosmo-prod
        id: cosmo_prod
        if: github.event_name == 'schedule' || inputs.system == 'all' || inputs.system == 'cosmo-prod'
        continue-on-error: true
        run: bash scripts/backup/dump.sh --system cosmo-prod

      - name: Fail if any required dump failed
        run: |
          fail=0
          check() {
            local name="$1"
            local outcome="$2"
            local requested="$3"
            if [[ "$requested" != "true" ]]; then
              return 0
            fi
            if [[ "$outcome" == "failure" ]]; then
              echo "$name dump failed"
              fail=1
            fi
          }
          VAULT_REQ="${{ github.event_name == 'schedule' || inputs.system == 'all' || inputs.system == 'vault' }}"
          PROD_REQ="${{ github.event_name == 'schedule' || inputs.system == 'all' || inputs.system == 'cosmo-prod' }}"
          check vault "${{ steps.vault.outcome }}" "$VAULT_REQ"
          check cosmo-prod "${{ steps.cosmo_prod.outcome }}" "$PROD_REQ"
          exit "$fail"

      # GitHub only emails whoever last edited the cron line, so mail the ops list directly.
      - name: Email failure alert
        if: failure()
        env:
          MAILEROO_API_KEY: ${{ secrets.MAILEROO_API_KEY }}
          MAILEROO_FROM_EMAIL: ${{ secrets.MAILEROO_FROM_EMAIL }}
          BACKUP_ALERT_EMAILS: chami@cosmetics.lk,sasindadilhan98@gmail.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VAULT_OUTCOME: ${{ steps.vault.outcome }}
          PROD_OUTCOME: ${{ steps.cosmo_prod.outcome }}
          TRIGGER: ${{ github.event_name }}
        run: |
          node --input-type=module <<'EOF'
          const { MAILEROO_API_KEY: key, MAILEROO_FROM_EMAIL: from } = process.env;
          if (!key || !from) {
            console.log("::error::MAILEROO_API_KEY / MAILEROO_FROM_EMAIL secrets missing; alert not sent");
            process.exit(1);
          }
          const label = (o) => (o === "success" ? "OK" : o === "failure" ? "FAILED" : "did not run");
          const lines = [
            `Vault OS: ${label(process.env.VAULT_OUTCOME)}`,
            `Cosmo OS production: ${label(process.env.PROD_OUTCOME)}`,
            `Trigger: ${process.env.TRIGGER}`,
            `Run log: ${process.env.RUN_URL}`,
            "",
            "Fix the same day. Runbook: docs/ops/backup-disaster-recovery.md",
          ];
          const res = await fetch("https://smtp.maileroo.com/api/v2/emails", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Api-Key": key },
            body: JSON.stringify({
              from: { address: from, display_name: "Cosmo OS Backups" },
              to: process.env.BACKUP_ALERT_EMAILS.split(",").map((address) => ({ address: address.trim() })),
              subject: "Backup FAILED - Cosmo OS / Vault OS",
              plain: lines.join("\n"),
              html: `<p>${lines.join("<br>").replace(/(https:\/\/\S+)/, '<a href="$1">$1</a>')}</p>`,
            }),
          });
          console.log(`Maileroo ${res.status}: ${await res.text()}`);
          if (!res.ok) process.exit(1);
          EOF
